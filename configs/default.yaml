# Default configuration for UD Genre Bootstrap

ud_version: "2.17"
ud_source: "hf://universal-dependencies/universal_dependencies"  # or "local:///path/to/ud"
metadata_path: null  # Optional explicit metadata.json path; set this when source metadata lives outside default auto-detect locations

# Optional: Include only specific treebanks (None = all treebanks)
# CLI --treebank flag overrides this setting
# include_treebanks:
#   - "en_ewt"
#   - "de_gsd"
#   - "fr_gsd"

# Optional: Exclude specific treebanks from all operations
# exclude_treebanks:
#   - "got_proiel"  # Gothic (very old language)
#   - "cu_proiel"   # Old Church Slavonic
#   - "la_proiel"   # Latin

embeddings:
  model: "xlm-roberta-base"
  pooling: "mean"  # mean, cls
  batch_size: 64
  layer: -1  # -1 for last layer
  device: "auto"  # auto, cuda, cpu
  cache_dir: "cache/{ud_version}/{embeddings.model}_{embeddings.pooling}_{embeddings.batch_size}_{embeddings.layer}-embeddings"

clustering:
  method: "gmm"  # "gmm" (CPU-only) or "kmeans" (GPU-accelerated via cuML)
  level: "treebank"  # Clustering granularity: "treebank" (only option currently implemented)
                     # Future: "language" (cluster all treebanks per language), "all" (cluster all treebanks together)
  seed: 42
  device: "auto"  # "auto" (use GPU if available), "cuda" (force GPU), "cpu" (force CPU)
                  # Note: GMM is CPU-only (cuML limitation), use K-Means for GPU acceleration
  fit_sample_size: null  # Optional: fit GMM on a random subset (e.g., 50000) for large treebanks, then predict all sentences

bootstrapping:
  min_confidence: 0.8
  min_margin: 0.05  # Minimum gap between top-1 and top-2 cosine similarity for high-confidence labeling
  reference_weighting: "sentence_count"  # "sentence_count" (default) or "uniform"
  max_iterations: 10
  fail_on_incomplete: false
  unresolved_handling: "null"  # null, omit, string:UNKNOWN

genre_extraction:
  # Optional: Map non-standard genre labels to canonical UD genres
  # See configs/genre_mappings.example.json for format
  mapping_path: null  # "configs/genre_mappings.json"

  # Optional: Define patterns for extracting genres from sentence metadata
  # Can be a single file or a list of files (patterns are merged)
  # See configs/metadata_patterns.example.json and docs/GENRE_PATTERNS.md
  patterns_path: null  # "configs/metadata_patterns.json"
  # Or use multiple files:
  # patterns_path:
  #   - "configs/metadata_patterns.json"
  #   - "configs/pud-patterns.json"

  # Optional: Override the default canonical genre set
  # If not specified, uses the default UD genre taxonomy
  canonical_genres: null
  # Example: Use a custom genre set
  # canonical_genres:
  #   - "news"
  #   - "wiki"
  #   - "fiction"
  #   - "blog"
  #   - "legal"
  #   - "medical"
  #   - "spoken"

# Evaluation settings.
# Note: metadata_validation.coverage_threshold and
# metadata_validation.min_genre_sentences are also used by the production
# pipeline as quality gates for virtual-split creation.
evaluation:
  enabled: true

  # Optional named evaluation sets for reproducible comparisons.
  # Use with: --set literature_small --set literature_full
  # treebank_sets:
  #   literature_small:
  #     - "de_pud"
  #     - "cs_pdtc"
  #   literature_full:
  #     - "de_pud"
  #     - "cs_pdtc"
  #     - "en_pud"

  metadata_validation:
    protocol: "generalization"  # "generalization" (default) or "paper_parity" for original fixed-split GMM+L-style evaluation
    method: "kfold"  # kfold, holdout
    k: 5
    stratify_by: "genre"
    group_by: "language"  # Group by: "treebank" (treebank-level CV), "language" (language-level CV), or null
    anchor_mode: "strict"  # "strict" = fold-train anchors only; "parity" = broader single-genre anchors for comparability-style runs (not the full paper protocol)
    anchor_pool_policy: "auto"  # "auto" -> strict=train_virtual, parity=combined; explicit: "train_virtual", "single_genre", "combined"; paper_parity forces single_genre
    coverage_threshold: 0.95  # Minimum sentence-level metadata coverage for virtual-split creation (production + evaluation)
    min_genre_sentences: 100  # Minimum sentences per genre for virtual-split creation (production + evaluation)

  cluster_metrics:
    - "silhouette"
    - "calinski_harabasz"
    - "davies_bouldin"

  convergence_metrics:
    - "resolution_rate"
    - "disjunct_combinations"
    - "confidence_distribution"

output:
  genres_path: "output/{ud_version}/{embeddings.model}_{embeddings.pooling}_{embeddings.batch_size}_{embeddings.layer}_{clustering.method}_{bootstrapping.min_confidence}/genres/"
  embeddings_hf_repo: "commul/ud-embeddings-xlm-roberta-base"
  embeddings_revision: "2.17"
  genres_hf_repo: "commul/ud_genre"
  genres_revision: "2.17"
  config_name: null  # Optional frozen config label copied into release artifacts / all_genres.parquet
  run_id: null  # Optional stable release run identifier copied into release artifacts / all_genres.parquet
  ud_source_revision: null  # Optional explicit UD snapshot/revision label for exported provenance
  baseline_summary_path: null  # Optional path to a locked evaluation baseline JSON copied to evaluation/baseline_summary.json
  push_to_hub: false  # Set to true when ready to publish
  hf_token: "${HF_TOKEN}"  # From environment variable

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
