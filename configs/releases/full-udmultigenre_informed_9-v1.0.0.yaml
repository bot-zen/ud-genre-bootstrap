# Full-scope projected reduced schema informed by UD-MULTIGENRE, CMC/register
# considerations, and UD 2.17/2.18 evidence. This train is generated by
# projecting the existing full-ud-v1.1.1 `ud` labels; it is not the default UD
# label-schema release train.

release_profile: "../release_profiles/full-ud.yaml"

train:
  train_id: "full-udmultigenre_informed_9-v1.0.0"
  status: "partial"
  scope: "full"
  label_schema: "udmultigenre_informed_9"
  artifact_version: "v1.0.0"
  supported_ud_versions:
    - "2.17"
    - "2.18"
  default_ud_version: "2.18"
  hf_repo: "commul/ud_genre"
  hf_default_branch: "main"
  source_repo: "git@github.com:bot-zen/ud-genre-bootstrap.git"
  source_branch: "release/full-udmultigenre_informed_9-v1"
  source_tag: "source/full-udmultigenre_informed_9-v1.0.0"

defaults:
  genre_extraction:
    canonical_genres:
      - "expository"
      - "grammar_examples"
      - "interactional"
      - "learner_essays"
      - "literary"
      - "news"
      - "regulatory"
      - "spoken"
      - "web_residual"
  output:
    baseline_summary_path: null

versions:
  "2.17":
    release:
      hf_branches:
        - "udmultigenre_informed_9/2.17"
    output:
      genres_path: "output/2.17-udmultigenre_informed_9-release/genres"
      config_name: "2.17-udmultigenre_informed_9-release"
      ud_source_revision: "2.17"
  "2.18":
    release:
      hf_branches:
        - "udmultigenre_informed_9/2.18"
    output:
      genres_path: "output/2.18-udmultigenre_informed_9-release/genres"
      config_name: "2.18-udmultigenre_informed_9-release"
      ud_source_revision: "2.18"
