# Exploratory reduced-genre projections for the current label_schema=ud.
#
# These candidates are analysis inputs only. They must not be used as promoted
# release schemas without creating a separate label_schema release train.

source_label_schema: "ud"
source_genres:
  - "academic"
  - "bible"
  - "blog"
  - "email"
  - "fiction"
  - "government"
  - "grammar-examples"
  - "learner-essays"
  - "legal"
  - "medical"
  - "news"
  - "nonfiction"
  - "poetry"
  - "reviews"
  - "social"
  - "spoken"
  - "web"
  - "wiki"

candidate_schemas:
  low_support_absorbed:
    description: "Minimal projection that only absorbs sparse or ambiguous labels into nearby UD-v2 labels."
    target_genres:
      - "academic"
      - "bible"
      - "blog"
      - "fiction"
      - "grammar-examples"
      - "learner-essays"
      - "legal"
      - "news"
      - "nonfiction"
      - "poetry"
      - "reviews"
      - "social"
      - "spoken"
      - "wiki"
    mapping:
      academic: "academic"
      bible: "bible"
      blog: "blog"
      email: "social"
      fiction: "fiction"
      government: "legal"
      grammar-examples: "grammar-examples"
      learner-essays: "learner-essays"
      legal: "legal"
      medical: "academic"
      news: "news"
      nonfiction: "nonfiction"
      poetry: "poetry"
      reviews: "reviews"
      social: "social"
      spoken: "spoken"
      web: "blog"
      wiki: "wiki"
    rationale:
      email: "Small support and interactional/register overlap with social writing."
      government: "Regulatory/institutional overlap with legal."
      medical: "Mostly specialized expository domain; closer to academic than to a stable genre."
      web: "Medium-like and ambiguous; closest minimal merge target is blog/web-origin writing."

  communicative_function:
    description: "Function-oriented projection that separates narrative, expository, regulatory, interactional, and spoken material."
    target_genres:
      - "expository"
      - "instructional"
      - "interactional"
      - "literary"
      - "news"
      - "regulatory"
      - "review"
      - "spoken"
      - "web_unspecified"
    mapping:
      academic: "expository"
      bible: "literary"
      blog: "interactional"
      email: "interactional"
      fiction: "literary"
      government: "regulatory"
      grammar-examples: "instructional"
      learner-essays: "instructional"
      legal: "regulatory"
      medical: "expository"
      news: "news"
      nonfiction: "expository"
      poetry: "literary"
      reviews: "review"
      social: "interactional"
      spoken: "spoken"
      web: "web_unspecified"
      wiki: "expository"
    rationale:
      literary: "Groups labels whose primary organization is narrative or verse rather than topic."
      expository: "Groups informational prose and specialized descriptive text."
      instructional: "Keeps grammar examples and learner classroom text apart from ordinary exposition."
      regulatory: "Groups law, treaties, contracts, official regulations, and governmental documents."
      interactional: "Groups first-person, addressive, user-generated, or socially situated writing."

  ud_contribution_guidance_approx:
    description: "Approximate projection toward the newer UD contribution-page text-type guidance."
    target_genres:
      - "academic"
      - "encyclopedia"
      - "essay"
      - "grammar"
      - "instruction"
      - "learner"
      - "mail"
      - "narration"
      - "news"
      - "poetry"
      - "regulation"
      - "review"
      - "social"
      - "spoken_unspecified"
    mapping:
      academic: "academic"
      bible: "narration"
      blog: "essay"
      email: "mail"
      fiction: "narration"
      government: "regulation"
      grammar-examples: "grammar"
      learner-essays: "learner"
      legal: "regulation"
      medical: "instruction"
      news: "news"
      nonfiction: "essay"
      poetry: "poetry"
      reviews: "review"
      social: "social"
      spoken: "spoken_unspecified"
      web: "essay"
      wiki: "encyclopedia"
    rationale:
      bible: "The current UD guidance treats the former bible genre as narration."
      nonfiction: "Lossy approximation: released nonfiction metadata does not distinguish essay, instruction, encyclopedia, or narration."
      spoken: "Lossy approximation: released spoken metadata does not distinguish speech, interview, or spontaneous."
      medical: "Health reports and similar specialized descriptive texts are closest to instruction in the newer guidance."

  convergent_functional_7:
    description: "Balanced 7-way candidate combining functional groupings with the strongest UD 2.18 cluster-merge evidence."
    target_genres:
      - "expository"
      - "instructional"
      - "interactional"
      - "literary"
      - "public_discourse"
      - "regulatory"
      - "web_unspecified"
    mapping:
      academic: "expository"
      bible: "literary"
      blog: "interactional"
      email: "interactional"
      fiction: "literary"
      government: "regulatory"
      grammar-examples: "instructional"
      learner-essays: "instructional"
      legal: "regulatory"
      medical: "expository"
      news: "public_discourse"
      nonfiction: "expository"
      poetry: "literary"
      reviews: "interactional"
      social: "interactional"
      spoken: "public_discourse"
      web: "web_unspecified"
      wiki: "expository"
    rationale:
      expository: "Groups informational prose and specialized descriptive text."
      instructional: "Keeps grammar examples and learner classroom text apart from ordinary exposition."
      interactional: "Matches the strict cluster-merge component joining blog, email, reviews, and social writing."
      literary: "Groups labels whose primary organization is narrative, religious narrative, or verse."
      public_discourse: "Matches the strict cluster-merge component joining news and spoken material, while preserving it separately from exposition."
      regulatory: "Groups law, official regulations, and governmental documents."
      web_unspecified: "Keeps web separate because it is source/channel-like and did not join blog under the strict cluster-merge threshold."
