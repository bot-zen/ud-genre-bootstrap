# Frozen community-release profile for UD v2.17.
# This now identifies the v1.0.1 metadata refresh; label data are unchanged from v1.
# The attached baseline summary points to the locked end-user 10-fold generalization baseline.

ud_version: "2.17"
ud_source: "hf://universal-dependencies/universal_dependencies"
metadata_path: null

release:
  artifact_id: "ud2.17-full-ud-v1.0.1"
  scope: "full"
  label_schema: "ud"
  artifact_version: "v1.0.1"
  hf_repo: "commul/ud_genre"
  hf_branches:
    - "2.17"
  hf_tag: "artifact/ud2.17-full-ud-v1.0.1"
  hf_default_branch: "main"
  source_repo: "git@github.com:bot-zen/ud-genre-bootstrap.git"
  source_branch: "release/v1"
  source_tag: "source/ud2.17-full-ud-v1.0.1"

exclude_treebanks:
  - "ar_nyuad"
  - "ja_bccwj"
  - "pt_cintil"

embeddings:
  model: "intfloat/multilingual-e5-large"
  pooling: "mean"
  batch_size: 32
  layer: -1
  device: "auto"
  cache_dir: "/tmp/ud-genre-bootstrap_cache/{ud_version}/community-release/{embeddings.model}_{embeddings.pooling}_{embeddings.batch_size}_{embeddings.layer}-embeddings"

clustering:
  method: "gmm"
  level: "treebank"
  seed: 42
  device: "auto"
  fit_sample_size: null

bootstrapping:
  min_confidence: 0.8
  min_margin: 0.05
  reference_weighting: "sentence_count"
  max_iterations: 32
  fail_on_incomplete: false
  unresolved_handling: "null"

genre_extraction:
  mapping_path: "configs/genre_mappings.json"
  patterns_path:
    - "configs/metadata_patterns.json"
    - "configs/pud-patterns.json"
  canonical_genres: null

evaluation:
  enabled: true
  treebank_sets:
    how_universal:
      - "be_hse"
      - "cs_cac"
      - "en_ewt"
      - "de_lit"
      - "pl_lfg"
      - "ru_taiga"
      - "ar_pud"
      - "cs_pud"
      - "de_pud"
      - "en_pud"
      - "es_pud"
      - "fi_pud"
      - "fr_pud"
      - "hi_pud"
      - "id_pud"
      - "is_pud"
      - "it_pud"
      - "ja_pud"
      - "ko_pud"
      - "pl_pud"
      - "pt_pud"
      - "ru_pud"
      - "sv_pud"
      - "th_pud"
      - "tr_pud"
      - "zh_pud"
    all_focused:
      - "ar_pud"
      - "be_hse"
      - "cs_cac"
      - "cs_cltt"
      - "cs_fictree"
      - "cs_pdtc"
      - "cs_pud"
      - "de_gsd"
      - "de_hdt"
      - "de_lit"
      - "de_pud"
      - "en_ewt"
      - "en_gum"
      - "en_pud"
      - "egy_ujaen"
      - "es_pud"
      - "fi_pud"
      - "fr_poitevindivital"
      - "fr_pud"
      - "fr_rhapsodie"
      - "gl_pud"
      - "gsw_divital"
      - "hi_pud"
      - "id_pud"
      - "is_pud"
      - "it_pud"
      - "ja_pud"
      - "ja_pudluw"
      - "ko_pud"
      - "pl_lfg"
      - "pl_pud"
      - "pro_corag"
      - "pt_petrogold"
      - "pt_pud"
      - "ru_pud"
      - "ru_syntagrus"
      - "ru_taiga"
      - "sv_pud"
      - "th_pud"
      - "tr_pud"
      - "tt_nmctt"
      - "yi_yitb"
      - "zh_pud"
  metadata_validation:
    protocol: "generalization"
    method: "kfold"
    k: 10
    stratify_by: "genre"
    group_by: "language"
    anchor_mode: "parity"
    anchor_pool_policy: "combined"
    coverage_threshold: 0.95
    min_genre_sentences: 100
  cluster_metrics:
    - "silhouette"
    - "calinski_harabasz"
    - "davies_bouldin"
  convergence_metrics:
    - "resolution_rate"
    - "disjunct_combinations"
    - "confidence_distribution"

xgenre_evaluation:
  model: "classla/xlm-roberta-base-multilingual-text-genre-classifier"
  batch_size: 32
  device: "auto"
  genre_mapping:
    News: "news"
    Legal: "legal"
    Information/Explanation: "wiki"
    Forum: "social"
    Prose/Lyrical: "fiction"
    Opinion/Argumentation: "reviews"
    Instruction: "nonfiction"
    Promotion: "web"
    Other: null

output:
  genres_path: "output/2.17-community-release/genres"
  embeddings_hf_repo: "commul/ud-embeddings-multilingual-e5-large"
  embeddings_revision: "2.17"
  genres_hf_repo: "commul/ud_genre"
  genres_revision: "2.17"
  config_name: "2.17-community-release"
  run_id: "ud-v2.17-community-release-v1.0.1"
  ud_source_revision: "2.17"
  baseline_summary_path: "configs/baselines/2.17-all_focused-generalization-e5_large-k10-anchor_combined.json"
  push_to_hub: false
  hf_token: "${HF_TOKEN}"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
