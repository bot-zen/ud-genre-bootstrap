[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ud-genre-bootstrap"
version = "0.1.0"
description = "Modern re-implementation of genre classification for Universal Dependencies using bootstrapping"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Egon W. Stemle", email = "egon.stemle@eurac.edu"},
]
keywords = ["nlp", "universal-dependencies", "genre-classification", "bootstrapping", "clustering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "ud-hf-parquet-tools @ git+https://github.com/bot-zen/ud-hf-parquet-tools@main",
    "datasets>=2.14.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.16.0",
    "tqdm>=4.65.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "umap-learn>=0.5.3",
]

[project.scripts]
ud-genre-bootstrap = "ud_genre_bootstrap.cli:app"

[project.urls]
Homepage = "https://github.com/bot-zen/ud-genre-bootstrap"
Documentation = "https://github.com/bot-zen/ud-genre-bootstrap#readme"
Repository = "https://github.com/bot-zen/ud-genre-bootstrap"
"Bug Tracker" = "https://github.com/bot-zen/ud-genre-bootstrap/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatchling.build.targets.wheel]
packages = ["src/ud_genre_bootstrap"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=ud_genre_bootstrap --cov-report=term-missing"
